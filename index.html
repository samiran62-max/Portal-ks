<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Kepala Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-950 text-white min-h-screen flex flex-col justify-center items-center">

  <!-- ================= LAYAR LOGIN ================= -->
  <div id="loginScreen" class="w-full max-w-md p-6 sm:p-8 bg-blue-950/80 backdrop-blur-md rounded-3xl shadow-2xl border border-blue-700/50 mx-4 my-8">
    <!-- Logo -->
    <div class="flex justify-center mb-4">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRESVnGGzgEIkf9q6nFxX3TJ2oCPb2g8wWhobdhB6didA&s" 
           alt="Logo Sekolah" class="h-16 w-auto object-contain bg-white/10 p-2 rounded-2xl">
    </div>

    <!-- Judul -->
    <div class="text-center mb-6">
      <h1 class="text-xl font-extrabold text-white tracking-wide">PORTAL KEPALA SEKOLAH</h1>
      <p class="text-xs text-blue-200 mt-1">Silakan login untuk mengakses aplikasi</p>
    </div>

    <!-- Form Login -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <!-- Alert Error -->
      <div id="errorMessage" class="hidden p-3 bg-red-900/80 border border-red-500 text-red-100 text-xs rounded-xl text-center font-medium">
        Username atau password salah!
      </div>

      <!-- Input Username -->
      <div>
        <label for="username" class="block text-xs font-semibold text-blue-100 mb-1.5">Username</label>
        <input type="text" id="username" required placeholder="Masukkan username"
               class="w-full px-4 py-2.5 text-sm rounded-xl bg-blue-900/60 border border-blue-600 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all">
      </div>

      <!-- Input Password -->
      <div>
        <label for="password" class="block text-xs font-semibold text-blue-100 mb-1.5">Password</label>
        <input type="password" id="password" required placeholder="Masukkan password"
               class="w-full px-4 py-2.5 text-sm rounded-xl bg-blue-900/60 border border-blue-600 text-white placeholder-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all">
      </div>

      <!-- Tombol Login -->
      <button type="submit" 
              class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-900/50 transition-all duration-200 mt-2">
        Masuk Portal
      </button>
    </form>
  </div>

  <!-- ================= DASHBOARD PORTAL (SETELAH LOGIN) ================= -->
  <div id="dashboardScreen" class="hidden w-full max-w-5xl mx-auto py-10 px-4">
    <!-- Header Dashboard -->
    <div class="flex flex-col sm:flex-row justify-between items-center bg-blue-950/80 backdrop-blur-md p-6 rounded-2xl border border-blue-700/50 shadow-xl mb-8 gap-4">
      <div class="flex items-center gap-4">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRESVnGGzgEIkf9q6nFxX3TJ2oCPb2g8wWhobdhB6didA&s" 
             alt="Logo Sekolah" class="h-12 w-auto bg-white/10 p-1.5 rounded-xl">
        <div>
          <h1 class="text-2xl font-bold text-white">Portal Layanan & Aplikasi</h1>
          <p class="text-xs text-blue-200">Akses terpadu Kepala Sekolah SMPN 1 Kandat</p>
        </div>
      </div>
      <button onclick="handleLogout()" 
              class="px-4 py-2 bg-red-600/30 hover:bg-red-600 text-red-100 hover:text-white text-xs font-semibold rounded-xl border border-red-500/50 transition-all flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Keluar
      </button>
    </div>

    <!-- Tampilan Loading -->
    <div id="loading" class="text-center text-white py-12">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-white border-t-transparent mb-3"></div>
      <p class="text-sm font-medium text-blue-100">Memuat data dari Google Spreadsheet...</p>
    </div>

    <!-- Grid Aplikasi -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden" id="appGrid"></div>

    <!-- Footer -->
    <div class="text-center mt-12 text-xs text-blue-200">
      &copy; SMP Negeri 1 Kandat. All rights reserved.
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJIu0weg6REkQ9TWN1EEc9G8gaeHj9KLpm_KQ5N2DdT3WzroP-No-m5eZLgA9bec4/exec";

    document.addEventListener("DOMContentLoaded", function() {
      if (sessionStorage.getItem("isLoggedIn") === "true") {
        showDashboard();
      }
    });

    function handleLogin(event) {
      event.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();
      const errEl = document.getElementById("errorMessage");

      if (user === "ks" && pass === "ks") {
        sessionStorage.setItem("isLoggedIn", "true");
        errEl.classList.add("hidden");
        showDashboard();
      } else {
        errEl.classList.remove("hidden");
      }
    }

    function handleLogout() {
      sessionStorage.removeItem("isLoggedIn");
      document.getElementById("dashboardScreen").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
      document.body.className = "bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-950 text-white min-h-screen flex flex-col justify-center items-center";
      document.getElementById("loginForm").reset();
    }

    function showDashboard() {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("dashboardScreen").classList.remove("hidden");
      document.body.className = "bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-950 text-white min-h-screen py-6 px-4";
      loadApps();
    }

    // Pembersih kode warna (mengambil "#FEF3C7" dari "#FEF3C7 (Kuning Soft)")
    function cleanHexColor(str) {
      if (!str) return '#1e3a8a';
      const match = str.match(/#[0-9A-Fa-f]{6}/);
      return match ? match[0] : '#1e3a8a';
    }

    async function loadApps() {
      const gridContainer = document.getElementById('appGrid');
      const loadingEl = document.getElementById('loading');

      try {
        const response = await fetch(SCRIPT_URL);
        const apps = await response.json();
        
        gridContainer.innerHTML = '';

        if (!apps || apps.length === 0) {
          loadingEl.innerHTML = '<p class="text-white">Belum ada data aplikasi di spreadsheet.</p>';
          return;
        }

        apps.forEach(app => {
          const card = document.createElement('a');
          card.href = app.link || '#';
          card.target = '_blank';
          card.className = 'p-6 rounded-2xl shadow-xl border border-white/10 hover:shadow-2xl transition-all transform hover:-translate-y-1 block flex flex-col justify-between';
          
          // Menggunakan warna background yang dibaca dari spreadsheet
          card.style.backgroundColor = cleanHexColor(app.warna);

          card.innerHTML = `
            <div>
              <div class="text-4xl mb-4">${app.emoji || '🔗'}</div>
              <h2 class="text-xl font-bold text-white mb-2 drop-shadow">${app.nama}</h2>
              <p class="text-sm text-blue-100 font-medium mb-2 drop-shadow-sm">${app.subtitle || ''}</p>
            </div>
            <div class="mt-6 text-xs font-bold text-white flex items-center gap-1">
              Buka Aplikasi &rarr;
            </div>
          `;
          gridContainer.appendChild(card);
        });

        loadingEl.classList.add('hidden');
        gridContainer.classList.remove('hidden');
      } catch (error) {
        console.error('Gagal mengambil data:', error);
        loadingEl.innerHTML = '<p class="text-red-200 font-medium bg-red-900/80 p-4 rounded-xl border border-red-700">Gagal memuat data aplikasi.</p>';
      }
    }
  </script>
</body>
</html>
